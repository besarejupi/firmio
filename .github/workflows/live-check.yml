# Prüft von außen, welche Firmio-Version gerade live ist (nur manuell startbar).
# Ergebnis steht als Hinweise (Annotations) am Lauf.
name: Live-Check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Live-Version abfragen
        run: |
          B=https://firmio.netlify.app
          one() { tr '\n' ' ' | tr -s ' ' | cut -c1-300; }
          echo "::notice title=version.txt::$(curl -s -m 20 -o /tmp/v -w '%{http_code}' "$B/version.txt"; echo -n ' '; head -c 40 /tmp/v | one)"
          echo "::notice title=index.html::$(curl -s -m 20 -I "$B/" | grep -iE '^(HTTP|etag|age|date)' | one)"
          echo "::notice title=index-merkmale::$(curl -s -m 20 "$B/" | grep -oE '<html[^>]*>|retryBtn|id="inbox"' | sort | uniq -c | one)"
          echo "::notice title=app.js::$(curl -s -m 20 "$B/app.js" | grep -oE 'renderInbox|Fertig – Dokument senden|landet automatisch hier|checkUpdate' | sort | uniq -c | one)"
          echo "::notice title=sw.js::$(curl -s -m 20 "$B/sw.js" | grep -oE 'firmio-v[0-9]+' | head -1 | one)"
          echo "::notice title=api::$(curl -s -m 20 "$B/api/status" | one)"
